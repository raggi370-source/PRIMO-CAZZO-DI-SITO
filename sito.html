<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: block;text-align: center; background-color: rgb(87, 7, 87); color:white">

    <style>
        .riga-nome {
  text-align: center;
  margin: 40px auto;        

}
        .riga-nome2 {
  text-align: center;
  margin:1px auto;        


}


    .input-centrato {
        display: block;
        margin: 20px auto;
    
    }



.griglia-album {
  display: grid;
  grid-template-columns: repeat(3, 1fr); /* FORZA esattamente 3 elementi per riga */
  gap: 20px 40px;          /* 20px di spazio tra le righe, 40px tra le colonne */
  max-width: 900px;        /* Larghezza massima della griglia */
  margin: 30px auto;       /* Centra tutta la struttura nello schermo */
}


.singolo-album {
  display: flex;
  align-items: center;     
  gap: 10px;              
  list-style: none;        
}


.singolo-album img {
  width: 80px;
  height: 80px;
  object-fit: cover;
}

.bottondimensioni{
    width: 300px;
    height: 40px;
    display: block;
    margin: 0 auto;
   
}

    


    </style>
<div class="riga-nome">
    <span>nome:</span> <input type="text" placeholder="il tuo nome">
    <span>cognome:</span> <input type="text" placeholder="il tuo cognome">
    <span>email:</span> <input type="email" placeholder="il tuo indirizzo email">
    
</div>
<div class="riga-nome2">
    <span>password:</span> <input type="password" placeholder="la tua password">
    <span>data di nascita:</span> <input type="date">
</div>



    
    <h2 style="text-align: center;" margin="20px 0">Seleziona il tuo album preferito</h2>
    






<div class="griglia-album">
    

  <!-- --- PRIMA RIGA (Primi 3 elementi) --- -->
  <div class="singolo-album">
    <img src="https://m.media-amazon.com/images/I/81OJxs2RJVL._UF1000,1000_QL80_.jpg" alt="AC/DC">
    <label>AC/DC <input type="radio" name="scelta"></label>
  </div>

  <div class="singolo-album">
    <img src="https://i.scdn.co/image/ab67616d0000b27302d6d017554ec5acbce7b274" alt="Nirvana">
    <label>Nirvana <input type="radio" name="scelta"></label>
  </div>

  <div class="singolo-album">
    <img src="https://i.scdn.co/image/ab67616d0000b273da6f73a25f4c79d0e6b4a8bd" alt="imagine dragons">
    <label>Imagine Dragons <input type="radio" name="scelta"></label>
  </div>

  <!-- --- SECONDA RIGA (I successivi 3 elementi vanno sotto da soli) --- -->
  <div class="singolo-album">
    <img src="https://upload.wikimedia.org/wikipedia/en/d/dd/Thecuregreatesthits.JPG?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="The Cure">
    <label>The Cure <input type="radio" name="scelta"></label>
  </div>

  <div class="singolo-album">
    <img src="https://www.lafeltrinelli.it/images/0602475036746_0_0_0_0_0.jpg" alt="Songs of a Lost World">
    <label>Songs of a Lost World <input type="radio" name="scelta"></label>
  </div>

  <div class="singolo-album">
    <img src="https://www.emp-online.it/dw/image/v2/BBQV_PRD/on/demandware.static/-/Sites-master-emp/default/dw2770b27a/images/4/2/6/7/426781.jpg?sfrm=png" alt="Linkin Park 2">
    <label>Linkin Park <input type="radio" name="scelta"> </label>
  </div>

  <div class="singolo-album">
    <img src="https://www.emp-online.it/dw/image/v2/BBQV_PRD/on/demandware.static/-/Sites-master-emp/default/dwea390d0c/images/5/2/6/3/526371.jpg?sfrm=png" alt="wardruna">
    <label> wardruna<input type="radio" name="scelta"></label>
  </div>

  <div class="singolo-album">
    <img src="https://sprea.it/storage/images/products/50925/hd/cop_4711_1.jpg" alt="Pink Floyd">
    <label> Pink Floyd<input type="radio" name="scelta" ></label>
  </div>
  <div class="singolo-album">
    <img src="https://i1.sndcdn.com/artworks-mPpKsllX09y0-0-t500x500.jpg" alt="Daniel Pemberton" >
    <label> Daniel Pemberton<input type="radio" name="scelta"></label>
  </div>


</div>

<div class="bottondimensioni">

        <button type="submit" >Invia</button>
    </form>
</div>




</body>
</html>
